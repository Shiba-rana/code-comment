# ==============================================================================
# Render Blueprint Configuration for CodeComment AI Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: codecomment-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "https://code-comment-ai.vercel.app,http://localhost:5173,*"
      - key: OPENAI_API_KEY
        sync: false # Set securely in the Render Dashboard
      - key: OPENAI_BASE_URL
        value: https://api.atria-asi.ai/v1
      - key: OPENAI_MODEL
        value: Atria-Dawn-Preview
      - key: DOCUMENTATION_SCORE_THRESHOLD
        value: "3"
      - key: AI_BATCH_SIZE
        value: "10"
      - key: AUTO_APPLY_CONFIDENCE
        value: "0.70"
      - key: MAX_AI_CANDIDATES
        value: "15"
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "100"
